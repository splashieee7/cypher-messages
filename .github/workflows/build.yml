name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build foss release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Signing: add these four repository secrets and every build on main is a
      # signed, installable APK. Without them the build still runs but the APK
      # is unsigned (Android will refuse to install it).
      #   SIGNING_STORE_BASE64   base64 of keystore.jks
      #   SIGNING_STORE_PASSWORD
      #   SIGNING_KEY_ALIAS
      #   SIGNING_KEY_PASSWORD
      - name: Restore signing keystore
        if: ${{ secrets.SIGNING_STORE_BASE64 != '' }}
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
        run: echo "$SIGNING_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build
        env:
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_BASE64 != '' && format('{0}/keystore.jks', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # Gradle only treats the signing env as present when all four are non-empty
          if [ -z "$SIGNING_STORE_FILE" ]; then
            unset SIGNING_STORE_FILE SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleFossRelease

      - name: Rename artifact
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/foss/release/*.apk | head -n1)
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          OUT="cypher-messages-${VERSION}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cypher-messages-apk
          path: ${{ steps.apk.outputs.path }}

      # Tagging v1.0.0 (etc.) publishes a GitHub Release with the APK attached,
      # which is what Obtainium / a private F-Droid repo can track for updates.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
